name: Solution improvement
description: Propose a clearer, simpler, or more efficient roadmap or company solution.
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        A short explanation of what becomes clearer, safer, or faster is enough.

  - type: input
    id: problem-number
    attributes:
      label: Problem ID
      description: Enter the numeric LeetCode ID or tracked OA problem ID.
      placeholder: "125 or oa-pairs"
    validations:
      required: true

  - type: input
    id: problem-title
    attributes:
      label: Problem title
      placeholder: Valid Palindrome
    validations:
      required: true

  - type: input
    id: current-file
    attributes:
      label: Current solution file
      description: Provide the path of the existing solution.
      placeholder: neetcode-all/twopointers/125.py or companies/roblox/solutions/oa-pairs.py
    validations:
      required: true

  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: Explain how your implementation works.
      placeholder: Describe the algorithm step by step.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Why is this solution better?
      description: Explain whether it is clearer, simpler, less abstract, faster, or more memory-efficient.
      placeholder: |
        This version removes...
        It is easier to understand because...
        Its complexity improves from...
    validations:
      required: true

  - type: input
    id: time-complexity
    attributes:
      label: Proposed time complexity
      placeholder: O(n)
    validations:
      required: true

  - type: input
    id: space-complexity
    attributes:
      label: Proposed space complexity
      placeholder: O(1)
    validations:
      required: true

  - type: textarea
    id: trade-offs
    attributes:
      label: Trade-offs (optional)
      description: Mention any readability, speed, or memory compromise worth knowing about.
      placeholder: The solution uses less memory but...

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I compared the proposal with the current repository solution.
          required: true
        - label: I can explain why this change is useful.
          required: true
        - label: I checked that a similar issue is not already open.
          required: true
        - label: I agree to follow the repository Code of Conduct.
          required: true
