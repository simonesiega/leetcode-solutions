name: Problem request
description: Request a new problem for the NeetCode All roadmap or a company preparation plan.
title: "[Request] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a problem that is not already tracked.

  - type: input
    id: problem-id
    attributes:
      label: Problem ID
      description: Enter the numeric LeetCode ID or a short OA problem ID.
      placeholder: "15 or oa-pairs"
    validations:
      required: true

  - type: input
    id: problem-title
    attributes:
      label: Problem title
      placeholder: Three Sum
    validations:
      required: true

  - type: input
    id: problem-link
    attributes:
      label: Problem link
      description: Link to LeetCode or another problem source, if one is publicly available.
      placeholder: https://leetcode.com/problems/3sum/

  - type: dropdown
    id: collection
    attributes:
      label: Collection
      options:
        - NeetCode All
        - Company preparation
    validations:
      required: true

  - type: input
    id: destination
    attributes:
      label: Topic or company
      description: Enter the NeetCode topic or company workspace where this problem belongs.
      placeholder: Two Pointers or Roblox
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should this problem be added?
      description: Explain its roadmap relevance or connection to the company preparation plan.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I verified that this problem is not already tracked in the destination collection.
          required: true
        - label: I checked that a similar request is not already open.
          required: true
        - label: I am allowed to share the problem details included here.
          required: true
        - label: I agree to follow the repository Code of Conduct.
          required: true
