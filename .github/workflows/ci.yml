name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and tracker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate roadmap data and generated documentation
        run: |
          node --check scripts/update-readme-stats.js
          node scripts/update-readme-stats.js --check

      - name: Test roadmap validation and generation
        run: |
          node --check scripts/update-readme-stats.test.js
          node --test scripts/update-readme-stats.test.js

      - name: Validate company preparation tracker
        run: |
          node --check scripts/company-tracker.js
          node scripts/company-tracker.js --check

      - name: Test company preparation tracker
        run: |
          node --check scripts/company-tracker.test.js
          node --test scripts/company-tracker.test.js

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: python -m compileall -q neetcode-all companies
